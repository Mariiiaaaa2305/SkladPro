<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація | СкладPro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
    <main class="auth-container">
        <section class="login-card">
            <div class="auth-logo">📦</div>
            <p class="auth-brand">СкладPro</p>
            <h1>Створення акаунта</h1>
            <p class="auth-description">
                Зареєструйтеся, щоб отримати доступ до системи управління складом.
            </p>

            {% if error %}
                <p class="error-message">{{ error }}</p>
            {% endif %}

            <form method="POST" action="{{ url_for('auth.register') }}">
                <label for="username">Логін</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Придумайте логін"
                    autocomplete="username"
                    minlength="3"
                    maxlength="80"
                    required
                >

                <label for="password">Пароль</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Щонайменше 8 символів"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >

                <label for="confirm_password">Підтвердження пароля</label>
                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Повторіть пароль"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >

                <button class="auth-button" type="submit">
                    Створити акаунт
                </button>
            </form>

            <div class="auth-switch">
                <span>Уже маєте акаунт?</span>
                <a href="{{ url_for('auth.login') }}">Увійти</a>
            </div>
        </section>

        <p class="auth-footer">
            СкладPro · Система управління складом
        </p>
    </main>
</body>
</html>
