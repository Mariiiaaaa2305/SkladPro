
{% extends "base.html" %}

{% block content %}
<div class="container">
    <h1>Створення документа</h1>

    <p>
        <a href="{{ url_for('documents.list_documents') }}">
            ← До списку документів
        </a>
    </p>

    <form method="POST" action="{{ url_for('documents.create_document') }}">
        <div class="form-group">
            <label for="document_number">Номер документа *</label>
            <input
                type="text"
                id="document_number"
                name="document_number"
                maxlength="50"
                required
                value="{{ request.form.get('document_number', '') }}"
            >
        </div>

        <div class="form-group">
            <label for="document_type">Тип документа *</label>
            <select id="document_type" name="document_type" required>
                <option value="invoice">Накладна</option>
                <option value="act">Акт</option>
            </select>
        </div>

        <h2>Товарна позиція</h2>

        <div class="form-group">
            <label for="product_id">Товар *</label>
            <select id="product_id" name="product_id" required>
                <option value="">Оберіть товар</option>
                {% for product in products %}
                <option value="{{ product.id }}">
                    {{ product.name }} ({{ product.sku }}) — залишок: {{ product.quantity }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="quantity">Кількість *</label>
            <input
                type="number"
                id="quantity"
                name="quantity"
                min="1"
                step="1"
                required
            >
        </div>

        <div class="form-group">
            <label for="unit_price">Ціна за одиницю *</label>
            <input
                type="number"
                id="unit_price"
                name="unit_price"
                min="0"
                max="9999999999.99"
                step="0.01"
                required
            >
        </div>

        <div class="form-group">
            <label for="supplier_id">Постачальник</label>
            <select id="supplier_id" name="supplier_id">
                <option value="">Не вибрано</option>
                {% for supplier in suppliers %}
                <option value="{{ supplier.id }}">{{ supplier.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="contractor_id">Контрагент</label>
            <select id="contractor_id" name="contractor_id">
                <option value="">Не вибрано</option>
                {% for contractor in contractors %}
                <option value="{{ contractor.id }}">{{ contractor.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="notes">Примітки</label>
            <textarea id="notes" name="notes" rows="3">{{ request.form.get('notes', '') }}</textarea>
        </div>

        <button type="submit">Зберегти документ</button>
    </form>
</div>
{% endblock %}
